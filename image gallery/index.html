<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Image Gallery</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<h1>Responsive Image Gallery</h1>

<p>Maidah's Gallery</p>

</header>

<!-- Search -->

<div class="search-box">

<input type="text" id="search" placeholder="Search images...">

</div>

<!-- Filter Buttons -->

<div class="buttons">

<button class="active" data-filter="all">All</button>

<button data-filter="nature">Nature</button>

<button data-filter="city">City</button>

<button data-filter="Coffee">Coffee</button>

<button data-filter="food">Food</button>

<button data-filter="friends">Friends</button>

<button data-filter="aesthetics">Aesthetics</button>

</div>

<!-- Gallery -->

<div class="gallery">

    <div class="image nature">
        <img src="images/nature1.jpg" alt="Nature">
    </div>


<div class="image city">

<img src="images/city1.jpg" alt="City">

</div>

<div class="image Coffee">

    <img src="images/Coffee.jpg" alt="Coffee">
    
    </div>






<div class="image food">

<img src="images/food1.jpg" alt="Food">

</div>



<div class="image Friends">

    <img src="images/friends1.jpg" alt="Friends">
    
    </div>


    <div class="image Aesthetics">

        <img src="images/aesthetics1.jpg" alt="Aesthetics">
        
        </div>
        
        

</div>

<!-- Lightbox -->

<div class="lightbox">

<span class="close">&times;</span>

<i class="fa-solid fa-chevron-left prev"></i>

<img class="lightbox-image">

<i class="fa-solid fa-chevron-right next"></i>

</div>

<script src="script.js"></script>

</body>

</html>
